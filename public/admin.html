<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OlivaFix — Beheer</title>
<style>
  body { font-family: -apple-system, Inter, sans-serif; background: #FBF8F1; color: #2B2A26; margin: 0; padding: 20px; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #E7E0CF; border-radius: 6px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #7D7A6F; margin: 10px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #D8D2BE; border-radius: 4px; font-size: 14px; }
  button { background: #1E4638; color: #FBF8F1; border: none; padding: 12px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  button.danger { background: #B3261E; }
  button.secondary { background: none; border: 1px solid #D8D2BE; color: #2B2A26; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .error { color: #B3261E; font-size: 13px; }
  .msg { color: #1E4638; font-size: 13px; }
  #login { max-width: 320px; margin: 60px auto; }
</style>
</head>
<body>

<div id="login">
  <h1>OlivaFix — Beheer</h1>
  <label>Backend-URL</label>
  <input id="backendUrl" placeholder="https://proactive-happiness-production.up.railway.app" />
  <label>Beheerderswachtwoord</label>
  <input id="password" type="password" />
  <button onclick="login()">Inloggen</button>
  <p class="error" id="loginError"></p>
</div>

<div id="app" style="display:none; max-width: 600px; margin: 0 auto;">
  <h1>Producten beheren</h1>
  <div id="productList"></div>

  <div class="card">
    <h3>Nieuw product toevoegen</h3>
    <label>ID (uniek, bv. olv-9x75)</label>
    <input id="new-id" />
    <label>Naam</label>
    <input id="new-name" />
    <label>Variant (bv. "3 x 75g")</label>
    <input id="new-variant" />
    <label>Prijs in euro's (bv. 16.49)</label>
    <input id="new-price" />
    <label>Doorgestreepte prijs (optioneel)</label>
    <input id="new-compare" />
    <label>Beschrijving</label>
    <textarea id="new-desc"></textarea>
    <label>Afbeeldings-URL (optioneel, moet ergens gehost staan)</label>
    <input id="new-image" />
    <button onclick="createProduct()">Product toevoegen</button>
    <p class="error" id="createError"></p>
    <p class="msg" id="createMsg"></p>
  </div>
</div>

<script>
let backendUrl = "";
let password = "";

function login() {
  backendUrl = document.getElementById("backendUrl").value.replace(/\/$/, "");
  password = document.getElementById("password").value;
  localStorage.setItem("of_backend", backendUrl);
  loadProducts();
}

// Prefill backend URL if remembered
window.onload = () => {
  const saved = localStorage.getItem("of_backend");
  if (saved) document.getElementById("backendUrl").value = saved;
};

async function loadProducts() {
  document.getElementById("loginError").textContent = "";
  try {
    const res = await fetch(`${backendUrl}/api/products`);
    if (!res.ok) throw new Error("Kon producten niet laden.");
    const products = await res.json();
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    renderProducts(products);
  } catch (err) {
    document.getElementById("loginError").textContent = "Kon geen verbinding maken. Klopt de backend-URL?";
  }
}

function renderProducts(products) {
  const el = document.getElementById("productList");
  el.innerHTML = "";
  products.forEach((p) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="row">
        <div>
          <strong>${p.name}</strong> — ${p.variant}<br/>
          <span style="font-size:13px;color:#7D7A6F">€${(p.price_cents/100).toFixed(2)} · ID: ${p.id}</span>
        </div>
        <button class="danger" onclick="deleteProduct('${p.id}')">Verwijderen</button>
      </div>
    `;
    el.appendChild(div);
  });
}

async function deleteProduct(id) {
  if (!confirm("Dit product verwijderen?")) return;
  await fetch(`${backendUrl}/api/admin/products/${id}`, {
    method: "DELETE",
    headers: { "x-admin-password": password },
  });
  loadProducts();
}

async function createProduct() {
  const errorEl = document.getElementById("createError");
  const msgEl = document.getElementById("createMsg");
  errorEl.textContent = "";
  msgEl.textContent = "";

  const body = {
    id: document.getElementById("new-id").value.trim(),
    name: document.getElementById("new-name").value.trim(),
    variant: document.getElementById("new-variant").value.trim(),
    price_cents: Math.round(parseFloat(document.getElementById("new-price").value) * 100),
    compare_at_cents: document.getElementById("new-compare").value
      ? Math.round(parseFloat(document.getElementById("new-compare").value) * 100)
      : null,
    description: document.getElementById("new-desc").value.trim(),
    image_path: document.getElementById("new-image").value.trim(),
  };

  if (!body.id || !body.name || !body.variant || isNaN(body.price_cents)) {
    errorEl.textContent = "Vul minstens ID, naam, variant en prijs in.";
    return;
  }

  try {
    const res = await fetch(`${backendUrl}/api/admin/products`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-password": password },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Onbekende fout");
    msgEl.textContent = "Product toegevoegd!";
    ["new-id","new-name","new-variant","new-price","new-compare","new-desc","new-image"].forEach(id => document.getElementById(id).value = "");
    loadProducts();
  } catch (err) {
    errorEl.textContent = "Fout: " + err.message;
  }
}
</script>
</body>
</html>
